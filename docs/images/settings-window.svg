  <g transform="translate(784 18)">
    <rect x="0" y="0" width="392" height="94" rx="4" fill="#fbfdff" stroke="#c7d0df" />
    <rect x="0" y="0" width="392" height="18" fill="#f7f8fb" />
    <text x="10" y="13" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2430">SpeakText</text>
    <rect x="306" y="4" width="26" height="22" rx="2" fill="#ffffff" stroke="#c7d0df" />
    <circle cx="319" cy="15" r="4.2" fill="none" stroke="#2d6df5" stroke-width="1.3" />
    <circle cx="319" cy="15" r="1.4" fill="#2d6df5" />
    <path d="M319 8.5 v2.4 M319 19.1 v2.4 M312.5 15 h2.4 M323.1 15 h2.4 M314.4 10.4 l1.7 1.7 M322 18 l1.7 1.7 M323.6 10.4 l-1.7 1.7 M316 18 l-1.7 1.7" fill="none" stroke="#2d6df5" stroke-width="1.1" stroke-linecap="round" />
    <rect x="334" y="4" width="26" height="22" rx="2" fill="#ffffff" stroke="#c7d0df" />
    <text x="344" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c6b80">-</text>
    <rect x="362" y="4" width="22" height="22" rx="2" fill="#ffffff" stroke="#c7d0df" />
    <text x="369" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2d6df5">X</text>

    <rect x="10" y="37" width="112" height="34" rx="2" fill="#ffffff" stroke="#b8bdc8" />
    <text x="20" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2430">Automatic</text>
    <path d="M104 51 l7 7 l7 -7" fill="none" stroke="#76829b" stroke-width="2" stroke-linecap="round" />
    <text x="136" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#2d57f0">Windows Voices</text>
    <text x="136" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#586a8a">Shortcut: Ctrl + Alt + A</text>
    <rect x="274" y="34" width="118" height="38" rx="2" fill="#2d6df5" />
    <text x="288" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Read Selection</text>
  </g>
