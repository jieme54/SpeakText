<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c118f" />
      <stop offset="55%" stop-color="#a10f7c" />
      <stop offset="100%" stop-color="#ff325d" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#f6f9ff" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)" />
  <circle cx="1080" cy="680" r="180" fill="#ff4d70" opacity="0.25" />
  <circle cx="1030" cy="520" r="260" fill="#f044ff" opacity="0.08" />

  <g transform="translate(8 12)">
    <rect x="0" y="0" width="760" height="712" rx="14" fill="url(#windowGlow)" stroke="#d7ddeb" />
    <rect x="0" y="0" width="760" height="34" rx="14" fill="#f7f8fb" />
    <rect x="0" y="22" width="760" height="12" fill="#f7f8fb" />
    <text x="34" y="21" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#1f2430">SpeakText Settings</text>
    <circle cx="690" cy="17" r="5" fill="#f1b12b" />
    <circle cx="720" cy="17" r="5" fill="#6abf69" />
    <circle cx="748" cy="17" r="5" fill="#f16363" />

    <rect x="20" y="48" width="702" height="108" rx="14" fill="#ffffff" stroke="#b8d0ff" />
    <text x="42" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#14376b">Settings</text>
    <text x="42" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6c99">
      SpeakText uses local Windows voices. The app can be shown in multiple languages,
    </text>
    <text x="42" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6c99">
      and each language installed on the PC keeps its own voice, speed, and pitch.
    </text>

    <rect x="20" y="174" width="702" height="112" rx="14" fill="#ffffff" stroke="#b8d0ff" />
    <text x="42" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#14376b">Interface</text>
    <text x="42" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2f3f5b">Application language</text>
    <rect x="246" y="237" width="450" height="32" rx="4" fill="#f8f9fb" stroke="#b6bcc8" />
    <text x="256" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2430">English</text>
    <path d="M684 250 l8 8 l8 -8" fill="none" stroke="#76829b" stroke-width="2" stroke-linecap="round" />

    <rect x="20" y="306" width="702" height="188" rx="14" fill="#ffffff" stroke="#b8d0ff" />
    <text x="42" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#14376b">Global playback</text>
    <text x="42" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2f3f5b">Global shortcut</text>
    <rect x="246" y="374" width="372" height="34" rx="4" fill="#ffffff" stroke="#b6bcc8" />
    <text x="258" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2430">Ctrl + Alt + A</text>
    <rect x="630" y="374" width="72" height="34" rx="3" fill="#2d6df5" />
    <text x="646" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff">Capture</text>
    <text x="246" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2d6df5">
      Tip: the default shortcut is Ctrl + Alt + Shift + F12.
    </text>
    <rect x="248" y="455" width="14" height="14" fill="#ffffff" stroke="#5e6b83" />
    <path d="M251 462 l3 3 l6 -8" fill="none" stroke="#1f2430" stroke-width="2" stroke-linecap="round" />
    <text x="272" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2430">Keep the overlay always on top</text>
    <rect x="248" y="486" width="14" height="14" fill="#ffffff" stroke="#5e6b83" />
    <path d="M251 493 l3 3 l6 -8" fill="none" stroke="#1f2430" stroke-width="2" stroke-linecap="round" />
    <text x="272" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2430">Launch in background when Windows starts</text>

    <rect x="20" y="512" width="702" height="170" rx="14" fill="#ffffff" stroke="#b8d0ff" />
    <text x="42" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#14376b">Voice profile</text>
    <text x="42" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2f3f5b">Language to configure</text>
    <rect x="246" y="594" width="450" height="32" rx="4" fill="#f8f9fb" stroke="#b6bcc8" />
    <text x="256" y="615" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1f2430">English</text>
    <path d="M684 607 l8 8 l8 -8" fill="none" stroke="#76829b" stroke-width="2" stroke-linecap="round" />
    <rect x="572" y="531" width="34" height="34" rx="3" fill="#f8fbff" stroke="#b8d0ff" />
    <circle cx="589" cy="548" r="6" fill="none" stroke="#2d6df5" stroke-width="1.6" />
    <circle cx="589" cy="548" r="2.2" fill="#2d6df5" />
    <path d="M589 538 v4 M589 554 v4 M579 548 h4 M595 548 h4 M582.5 541.5 l2.8 2.8 M592.7 551.7 l2.8 2.8 M595.5 541.5 l-2.8 2.8 M585.3 551.7 l-2.8 2.8" fill="none" stroke="#2d6df5" stroke-width="1.4" stroke-linecap="round" />
    <rect x="616" y="531" width="80" height="34" rx="3" fill="#f8fbff" stroke="#b8d0ff" />
    <text x="631" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2d6df5">Test voice</text>

    <rect x="0" y="650" width="760" height="62" fill="#f7f8fb" />
    <rect x="576" y="664" width="74" height="34" rx="3" fill="#f4f7ff" stroke="#b8d0ff" />
    <text x="596" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4066b4">Cancel</text>
    <rect x="662" y="664" width="62" height="34" rx="3" fill="#2d6df5" />
    <text x="683" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ffffff">Save</text>

    <rect x="726" y="62" width="8" height="570" rx="4" fill="#eef1f6" />
    <rect x="726" y="74" width="8" height="102" rx="4" fill="#b7bdc9" />
