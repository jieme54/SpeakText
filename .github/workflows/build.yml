name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize packaged app icon
        run: |
          $iconPath = Join-Path (Get-Location) 'src\SpeakText.App\Assets\SpeakTextApp.ico'
          $iconBytes = [System.IO.File]::ReadAllBytes($iconPath)
          $hasIcoHeader = $iconBytes.Length -ge 4 -and $iconBytes[0] -eq 0 -and $iconBytes[1] -eq 0 -and $iconBytes[2] -eq 1 -and $iconBytes[3] -eq 0

          if (-not $hasIcoHeader) {
            $iconBase64 = [System.IO.File]::ReadAllText($iconPath).Trim()
            $decodedIcon = [Convert]::FromBase64String($iconBase64)
            [System.IO.File]::WriteAllBytes($iconPath, $decodedIcon)
          }
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\SpeakText.csproj --configfile .\NuGet.Config

      - name: Build
        run: dotnet build .\SpeakText.csproj -c Release --no-restore --configfile .\NuGet.Config

      - name: Publish app artifact
        run: |
          dotnet publish .\SpeakText.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o .\artifacts\build\SpeakText-win-x64 `
            --configfile .\NuGet.Config
        shell: pwsh

      - name: Create build archive
        run: |
          if (Test-Path .\artifacts\SpeakText-win-x64.zip) {
            Remove-Item .\artifacts\SpeakText-win-x64.zip -Force
          }
          Compress-Archive -Path .\artifacts\build\SpeakText-win-x64\* -DestinationPath .\artifacts\SpeakText-win-x64.zip
        shell: pwsh

      - name: Upload compiled app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakText-win-x64
          path: .\artifacts\SpeakText-win-x64.zip
